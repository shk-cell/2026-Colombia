<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Malgun Gothic', sans-serif; background: #05070c; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #app { width: 100%; max-width: 380px; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .screen { flex: 1; min-height: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; }
  .screen.show { display: flex; }
  h1, h2 { margin: 0; }
  p.hint { margin: 0; color: #9aa6ba; font-size: 14px; max-width: 260px; }
  input { font-size: 16px; padding: 10px 14px; border-radius: 8px; border: 1px solid #555; width: 200px; text-align: center; }
  button { font-size: 16px; font-weight: 700; padding: 10px 26px; border-radius: 999px; border: 0; background: #ff4d4d; color: #fff; cursor: pointer; }
  button:active { filter: brightness(0.9); }
  #hud { flex: none; display: flex; justify-content: space-between; width: 100%; padding: 10px 14px; font-size: 15px; font-weight: 700; }
  #gameScreen { padding: 0; }
  canvas { display: block; flex: none; touch-action: none; background: radial-gradient(circle at 50% 20%, #131a2b, #05070c 70%); border-radius: 12px; max-width: 100%; }
  table { border-collapse: collapse; width: 100%; max-width: 260px; }
  th, td { border: 1px solid #555; padding: 6px 10px; font-size: 14px; }
  th { background: #333; }
</style>
</head>
<body>
<div id="app">

  <div id="startScreen" class="screen show">
    <h1>💥 미사일 피하기</h1>
    <p class="hint">손가락(또는 마우스)으로 우주선을 움직여서<br>사방에서 날아오는 미사일을 최대한 오래 피하세요!</p>
    <input id="nameInput" placeholder="이름을 입력하세요" maxlength="10">
    <button id="startBtn">시작</button>
  </div>

  <div id="gameScreen" class="screen">
    <div id="hud"><span id="scoreLabel">점수: 0</span><span id="timeLabel">생존: 0.0초</span></div>
    <canvas id="canvas" width="340" height="520"></canvas>
  </div>

  <div id="overScreen" class="screen">
    <h2>게임 오버</h2>
    <p id="finalScore"></p>
    <table id="rankTable"></table>
    <button id="retryBtn">다시하기</button>
  </div>

</div>

<script>
(function () {
  var W = 340, H = 520;
  var PLAYER_R = 11, MISSILE_R = 6;
  var START_INTERVAL = 750, MIN_INTERVAL = 90, INTERVAL_DECAY_PER_SEC = 25;
  var START_SPEED = 120, MAX_SPEED = 520, SPEED_GROWTH_PER_SEC = 14;
  var START_HOMING = 0.4, MAX_HOMING = 2.2, HOMING_GROWTH_PER_SEC = 0.05;
  var MAX_SPAWN_PER_WAVE = 4;

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var hud = document.getElementById('hud');
  var gameScreen = document.getElementById('gameScreen');

  function fitCanvas() {
    var padding = 40;
    var availW = Math.min(gameScreen.clientWidth, 380) - padding;
    var availH = gameScreen.clientHeight - hud.offsetHeight - padding;
    var scale = Math.max(0.1, Math.min(availW / W, availH / H));
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
  }
  window.addEventListener('resize', fitCanvas);

  var player = { x: W / 2, y: H - 60, r: PLAYER_R };
  var missiles = [];
  var score = 0;
  var elapsed = 0;
  var spawnTimer = 0;
  var spawnInterval = START_INTERVAL;
  var missileSpeed = START_SPEED;
  var homingRate = START_HOMING;
  var playerName = '';
  var running = false;
  var lastTime = null;

  function clampPlayer() {
    player.x = Math.max(PLAYER_R, Math.min(W - PLAYER_R, player.x));
    player.y = Math.max(PLAYER_R, Math.min(H - PLAYER_R, player.y));
  }
  function pointerPos(evt) {
    var rect = canvas.getBoundingClientRect();
    var t = evt.touches ? evt.touches[0] : evt;
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    return { x: (t.clientX - rect.left) * scaleX, y: (t.clientY - rect.top) * scaleY };
  }
  function movePlayerTo(evt) {
    var p = pointerPos(evt);
    player.x = p.x; player.y = p.y;
    clampPlayer();
  }
  canvas.addEventListener('mousedown', movePlayerTo);
  canvas.addEventListener('mousemove', function (e) { if (running) movePlayerTo(e); });
  canvas.addEventListener('touchstart', function (e) { movePlayerTo(e); }, { passive: true });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); movePlayerTo(e); }, { passive: false });

  function spawnMissile() {
    var edge = Math.floor(Math.random() * 4);
    var x, y;
    if (edge === 0) { x = Math.random() * W; y = -20; }
    else if (edge === 1) { x = W + 20; y = Math.random() * H; }
    else if (edge === 2) { x = Math.random() * W; y = H + 20; }
    else { x = -20; y = Math.random() * H; }
    var angle = Math.atan2(player.y - y, player.x - x) + (Math.random() - 0.5) * 0.7;
    missiles.push({
      x: x, y: y, r: MISSILE_R,
      vx: Math.cos(angle) * missileSpeed,
      vy: Math.sin(angle) * missileSpeed
    });
  }

  function updateHud() {
    document.getElementById('scoreLabel').textContent = '점수: ' + score;
    document.getElementById('timeLabel').textContent = '생존: ' + (elapsed / 1000).toFixed(1) + '초';
  }

  function showScreen(id) {
    ['startScreen', 'gameScreen', 'overScreen'].forEach(function (s) {
      document.getElementById(s).classList.toggle('show', s === id);
    });
  }

  function startGame() {
    playerName = (document.getElementById('nameInput').value || '').trim().slice(0, 10) || '익명';
    missiles = []; score = 0; elapsed = 0; spawnTimer = START_INTERVAL;
    missileSpeed = START_SPEED; homingRate = START_HOMING;
    player.x = W / 2; player.y = H - 60;
    updateHud();
    showScreen('gameScreen');
    fitCanvas();
    running = true; lastTime = null;
    requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    showScreen('overScreen');
    document.getElementById('finalScore').textContent =
      playerName + '님의 점수: ' + score + ' (생존 ' + (elapsed / 1000).toFixed(1) + '초)';
    google.script.run.saveScore(playerName, score);
    google.script.run.withSuccessHandler(renderRanking).getRanking();
  }

  function renderRanking(list) {
    var html = '<tr><th>이름</th><th>점수</th></tr>';
    (list || []).forEach(function (row) {
      html += '<tr><td>' + escapeHtml(String(row[0])) + '</td><td>' + row[1] + '</td></tr>';
    });
    document.getElementById('rankTable').innerHTML = html;
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function step(dt) {
    elapsed += dt;
    var elapsedSec = elapsed / 1000;
    var dtSec = dt / 1000;

    spawnInterval = Math.max(MIN_INTERVAL, START_INTERVAL - elapsedSec * INTERVAL_DECAY_PER_SEC);
    missileSpeed = Math.min(MAX_SPEED, START_SPEED + elapsedSec * SPEED_GROWTH_PER_SEC);
    homingRate = Math.min(MAX_HOMING, START_HOMING + elapsedSec * HOMING_GROWTH_PER_SEC);

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      var count = Math.min(MAX_SPAWN_PER_WAVE, 1 + Math.floor(elapsedSec / 10));
      for (var c = 0; c < count; c++) spawnMissile();
      spawnTimer = spawnInterval;
    }

    for (var i = missiles.length - 1; i >= 0; i--) {
      var m = missiles[i];
      var desired = Math.atan2(player.y - m.y, player.x - m.x);
      var cur = Math.atan2(m.vy, m.vx);
      var diff = Math.atan2(Math.sin(desired - cur), Math.cos(desired - cur));
      var maxTurn = homingRate * dtSec;
      var turn = Math.max(-maxTurn, Math.min(maxTurn, diff));
      var newAngle = cur + turn;
      var spd = Math.hypot(m.vx, m.vy);
      m.vx = Math.cos(newAngle) * spd;
      m.vy = Math.sin(newAngle) * spd;
      m.x += m.vx * dtSec;
      m.y += m.vy * dtSec;

      if (m.x < -40 || m.x > W + 40 || m.y < -40 || m.y > H + 40) {
        missiles.splice(i, 1);
        continue;
      }
      var dx = m.x - player.x, dy = m.y - player.y;
      if (Math.hypot(dx, dy) < m.r + player.r) {
        endGame();
        return;
      }
    }

    score = Math.floor(elapsed / 100);
    updateHud();
  }

  function drawPlayer() {
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fillStyle = '#39d0ff';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#eafcff';
    ctx.stroke();
  }

  function drawMissile(m) {
    var angle = Math.atan2(m.vy, m.vx);
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(m.r * 1.7, 0);
    ctx.lineTo(-m.r, m.r * 0.8);
    ctx.lineTo(-m.r * 0.4, 0);
    ctx.lineTo(-m.r, -m.r * 0.8);
    ctx.closePath();
    ctx.fillStyle = '#ff4d4d';
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    missiles.forEach(drawMissile);
    drawPlayer();
  }

  function loop(ts) {
    if (!running) return;
    if (lastTime === null) lastTime = ts;
    var dt = Math.min(33, ts - lastTime);
    lastTime = ts;
    step(dt);
    if (running) {
      draw();
      requestAnimationFrame(loop);
    }
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', function () { showScreen('startScreen'); });
})();
</script>
</body>
</html>
