<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 바이브코딩 시대 교사의 역할</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span class="actions left">
    <a href="index.html" class="home">← 목록</a>
  </span>
  <span class="title">AI기반 바이브코딩 시대의 교사역할과 교수학습설계</span>
  <span class="actions">
    <button id="present" type="button">▶ 발표 모드</button>
    <a href="slides.pdf" download>PDF</a>
  </span>
</header>

<main id="deck"></main>

<div id="viewer" hidden>
  <img id="vimg" alt="">
  <span id="count"></span>
  <button class="nav prev" type="button" aria-label="이전">‹</button>
  <button class="nav next" type="button" aria-label="다음">›</button>
  <button class="close" type="button" aria-label="닫기">✕</button>
</div>

<script>
const TOTAL = 31;
const src = i => `slides/${String(i).padStart(2, '0')}.jpg`;
const deck = document.getElementById('deck');
for (let i = 1; i <= TOTAL; i++) {
  const fig = document.createElement('figure');
  fig.id = `s${i}`;
  fig.innerHTML = `<img src="${src(i)}" alt="슬라이드 ${i}" loading="${i < 3 ? 'eager' : 'lazy'}" width="1920" height="1080"><figcaption>${i} / ${TOTAL}</figcaption>`;
  fig.addEventListener('click', () => open(i));
  deck.appendChild(fig);
}

const viewer = document.getElementById('viewer');
const vimg = document.getElementById('vimg');
const count = document.getElementById('count');
let cur = 1;

function show(i) {
  cur = Math.min(TOTAL, Math.max(1, i));
  vimg.src = src(cur);
  vimg.alt = `슬라이드 ${cur}`;
  count.textContent = `${cur} / ${TOTAL}`;
  if (cur < TOTAL) new Image().src = src(cur + 1);
}
function open(i) {
  show(i);
  viewer.hidden = false;
  document.body.style.overflow = 'hidden';
  viewer.requestFullscreen?.().catch(() => {});
}
function close() {
  viewer.hidden = true;
  document.body.style.overflow = '';
  if (document.fullscreenElement) document.exitFullscreen();
  document.getElementById(`s${cur}`).scrollIntoView({ block: 'center' });
}

document.getElementById('present').onclick = () => open(1);
viewer.querySelector('.prev').onclick = e => { e.stopPropagation(); show(cur - 1); };
viewer.querySelector('.next').onclick = e => { e.stopPropagation(); show(cur + 1); };
viewer.querySelector('.close').onclick = e => { e.stopPropagation(); close(); };
vimg.onclick = e => { e.clientX > innerWidth / 2 ? show(cur + 1) : show(cur - 1); };
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && !viewer.hidden) close(); });
document.addEventListener('keydown', e => {
  if (viewer.hidden) return;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === 'Home') show(1);
  else if (e.key === 'End') show(TOTAL);
  else if (e.key === 'Escape') close();
});
let tx = null;
viewer.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
viewer.addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
  tx = null;
});
</script>
</body>
</html>
